<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ Practice</title>
<style>
:root{
  --bg:#f5f6fb;--card:#fff;--text:#1d2030;--muted:#6b7089;--line:#e3e6f0;
  --accent:#4f46e5;--accent-soft:#eceafd;
  --ok:#15803d;--ok-bg:#e7f7ec;--bad:#b91c1c;--bad-bg:#fdecec;
  --easy:#15803d;--medium:#b45309;--hard:#b91c1c;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141f;--card:#1c1f2e;--text:#eceefa;--muted:#9aa0bd;--line:#2d3150;
  --accent:#8b86ff;--accent-soft:#2a2850;--ok:#4ade80;--ok-bg:#12301f;--bad:#f87171;--bad-bg:#3a1618;
  --easy:#4ade80;--medium:#fbbf24;--hard:#f87171;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.8rem;margin:10px 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.subject{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
.subject:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(79,70,229,.15)}
.subject .num{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:2px 10px;font-size:.8rem}
.subject h3{margin:12px 0 4px;font-size:1.1rem}
.subject p{margin:0;color:var(--muted);font-size:.9rem}
.subject.empty{opacity:.75}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.stat b{font-size:1.2rem}
.stat span{color:var(--muted);font-size:.85rem;display:block}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:.3s}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.btn,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border-radius:10px}
.btn:hover,.chip:hover{border-color:var(--accent)}
select{border-radius:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:.78rem}
.tag{border-radius:99px;padding:2px 10px;font-weight:700;border:1px solid currentColor}
.tag.easy{color:var(--easy)}.tag.medium{color:var(--medium)}.tag.hard{color:var(--hard)}
.tag.topic{color:var(--muted);font-weight:600}
.qtext{font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .l{font-weight:700;color:var(--accent);min-width:18px}
.q.done .opt{cursor:default}
.q.done .opt:hover{border-color:var(--line)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .l{color:var(--bad)}
.note{margin-top:8px;font-size:.88rem;font-weight:600}
.note.ok{color:var(--ok)}.note.bad{color:var(--bad)}
.emptybox{text-align:center;padding:50px 20px;color:var(--muted)}
.result{text-align:center;font-size:1.1rem}
.hidden{display:none}
</style>
</head>

const DIFF = {e:"Easy", m:"Medium", h:"Hard"};
const app = document.getElementById("app");

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function build(raw){
  return raw.map((x,i)=>{
    const [d,t,q,c,...w] = x;
    const opts = shuffle([c,...w]);
    return {id:i, d, t, q, opts, a:opts.indexOf(c)};
  });
}

let state = null;

function showHome(){
  state = null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  app.innerHTML = "";
  app.appendChild(el("h1",null,"MCQ Practice"));
  app.appendChild(el("p","sub","Choose a subject to start practicing."));
  const grid = el("div","grid");
  SUBJECTS.forEach((s,i)=>{
    const b = el("button","subject"+(s.questions.length?"":" empty"));
    b.appendChild(el("span","num","Subject "+(i+1)));
    b.appendChild(el("h3",null,s.name));
    b.appendChild(el("p",null,s.questions.length ? s.questions.length+" questions · Easy, Medium, Hard" : "No MCQs added yet"));
    b.onclick = ()=>openSubject(s.id);
    grid.appendChild(b);
  });
  app.appendChild(grid);
}

function openSubject(id){
  const s = SUBJECTS.find(x=>x.id===id);
  if(!s){showHome();return;}
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  state = {subject:s, qs:build(s.questions), diff:"all", topic:"all", answers:{}};
  render();
}

function render(){
  const {subject, qs} = state;
  app.innerHTML = "";
  const back = el("button","back","← All subjects");
  back.onclick = showHome;
  app.appendChild(back);
  app.appendChild(el("h1",null,subject.name));

  if(!qs.length){
    const box = el("div","panel emptybox");
    box.appendChild(el("h3",null,"No MCQs added yet"));
    box.appendChild(el("p",null,"MCQs for this subject will appear here once they are added."));
    app.appendChild(box);
    return;
  }

  /* stats panel */
  const stats = el("div","panel");
  const row = el("div","stats");
  const mk = (id,label)=>{const d=el("div","stat");const b=el("b",null,"0");b.id=id;d.appendChild(b);d.appendChild(el("span",null,label));return d;};
  row.appendChild(mk("st-ans","Answered"));
  row.appendChild(mk("st-ok","Correct"));
  row.appendChild(mk("st-bad","Wrong"));
  row.appendChild(mk("st-pct","Score"));
  row.appendChild(mk("st-tot","Questions shown"));
  stats.appendChild(row);
  const bar = el("div","bar"); const fill = document.createElement("i"); fill.id="st-bar"; bar.appendChild(fill);
  stats.appendChild(bar);
  app.appendChild(stats);

  /* controls */
  const ctl = el("div","panel controls");
  const counts = {all:qs.length,e:0,m:0,h:0};
  qs.forEach(q=>counts[q.d]++);
  [["all","All"],["e","Easy"],["m","Medium"],["h","Hard"]].forEach(([k,label])=>{
    const c = el("button","chip"+(state.diff===k?" on":""),label+" ("+counts[k]+")");
    c.onclick = ()=>{state.diff=k;render();};
    ctl.appendChild(c);
  });
  const sel = document.createElement("select");
  const topics = ["all"].concat([...new Set(qs.map(q=>q.t))]);
  topics.forEach(t=>{
    const o = el("option",null,t==="all"?"All topics":t); o.value=t; if(state.topic===t) o.selected=true; sel.appendChild(o);
  });
  sel.onchange = ()=>{state.topic=sel.value;render();};
  ctl.appendChild(sel);
  const sh = el("button","btn","🔀 Shuffle");
  sh.onclick = ()=>{state.qs = shuffle(state.qs);render();};
  ctl.appendChild(sh);
  const rs = el("button","btn","↺ Restart");
  rs.onclick = ()=>{state.qs = build(subject.questions); state.answers={}; render(); window.scrollTo(0,0);};
  ctl.appendChild(rs);
  app.appendChild(ctl);

  /* questions */
  const list = qs.filter(q=>(state.diff==="all"||q.d===state.diff)&&(state.topic==="all"||q.t===state.topic));
  const holder = el("div");
  list.forEach((q,n)=>holder.appendChild(renderQ(q,n+1)));
  if(!list.length) holder.appendChild(el("div","panel emptybox","No questions match these filters."));
  app.appendChild(holder);
  app.appendChild(el("div","result hidden")).id = "final";
  updateStats(list);
}

function renderQ(q,n){
  const card = el("div","q");
  const meta = el("div","meta");
  meta.appendChild(el("span","tag "+({e:"easy",m:"medium",h:"hard"}[q.d]),DIFF[q.d]));
  meta.appendChild(el("span","tag topic",q.t));
  card.appendChild(meta);
  card.appendChild(el("p","qtext",n+". "+q.q));
  const letters = ["A","B","C","D"];
  const btns = [];
  q.opts.forEach((o,i)=>{
    const b = el("button","opt");
    b.appendChild(el("span","l",letters[i]+"."));
    b.appendChild(el("span",null,o));
    b.onclick = ()=>{
      if(state.answers[q.id]!==undefined) return;
      state.answers[q.id] = i;
      paint();
      updateStats();
    };
    btns.push(b); card.appendChild(b);
  });
  const note = el("div","note hidden");
  card.appendChild(note);
  function paint(){
    const chosen = state.answers[q.id];
    if(chosen===undefined) return;
    card.classList.add("done");
    btns.forEach((b,i)=>{
      if(i===q.a) b.classList.add("ok");
      else if(i===chosen) b.classList.add("bad");
    });
    note.classList.remove("hidden","ok","bad");
    if(chosen===q.a){note.classList.add("ok");note.textContent="✓ Correct";}
    else{note.classList.add("bad");note.textContent="✗ Wrong. Correct answer: "+letters[q.a]+". "+q.opts[q.a];}
  }
  paint();
  return card;
}

function updateStats(list){
  const {qs,answers} = state;
  const shown = qs.filter(q=>(state.diff==="all"||q.d===state.diff)&&(state.topic==="all"||q.t===state.topic));
  let ok=0,bad=0;
  shown.forEach(q=>{
    const a = answers[q.id];
    if(a===undefined) return;
    if(a===q.a) ok++; else bad++;
  });
  const done = ok+bad;
  document.getElementById("st-ans").textContent = done+" / "+shown.length;
  document.getElementById("st-ok").textContent = ok;
  document.getElementById("st-bad").textContent = bad;
  document.getElementById("st-pct").textContent = done ? Math.round(ok/done*100)+"%" : "-";
  document.getElementById("st-tot").textContent = shown.length;
  document.getElementById("st-bar").style.width = (shown.length ? done/shown.length*100 : 0)+"%";
  const fin = document.getElementById("final");
  if(fin){
    if(shown.length && done===shown.length){
      fin.classList.remove("hidden");
      fin.textContent = "🎉 Finished! You scored "+ok+" out of "+shown.length+" ("+Math.round(ok/shown.length*100)+"%).";
    } else fin.classList.add("hidden");
  }
}

/* start */
const hash = location.hash.replace("#","");
if(hash && SUBJECTS.some(s=>s.id===hash)) openSubject(hash); else showHome();
</script>
</body>
